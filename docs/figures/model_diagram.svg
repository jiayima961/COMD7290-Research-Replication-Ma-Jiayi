<g id="M3U"><rect x="810" y="630" width="560" height="110" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="826" y="658" font-size="23" font-weight="normal" font-style="normal">u3_j ~ Normal(0, sigma3_item^2)</text>
<text x="826" y="690" font-size="23" font-weight="normal" font-style="normal">Item-specific random intercept</text>
<text x="826" y="722" font-size="23" font-weight="normal" font-style="normal">Group key: text_id</text>
</g>
<g id="M3V"><rect x="810" y="825" width="560" height="110" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="826" y="853" font-size="22" font-weight="normal" font-style="normal">v3_aj ~ Normal(0, sigma3_actor^2)</text>
<text x="826" y="884" font-size="22" font-weight="normal" font-style="normal">Originating actor/statement random intercept</text>
<text x="826" y="915" font-size="22" font-weight="normal" font-style="normal">act_id = text_id + &#x27;_&#x27; + akteur_id</text>
</g>
<g id="M3ETA"><rect x="810" y="1040" width="560" height="135" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="826" y="1068" font-size="24" font-weight="normal" font-style="normal">eta3_raj = beta3_0 + X_j beta3</text>
<text x="826" y="1101" font-size="24" font-weight="normal" font-style="normal">+ u3_j + v3_aj</text>
<text x="826" y="1134" font-size="24" font-weight="normal" font-style="normal">Five fixed slopes plus a fixed intercept</text>
</g>
<g id="M3Y"><rect x="810" y="1230" width="560" height="147" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="826" y="1258" font-size="24" font-weight="normal" font-style="normal">Recognition: actrefrecbin</text>
<text x="826" y="1291" font-size="24" font-weight="normal" font-style="normal">Y3_raj ~ Bernoulli(p3_raj)</text>
<text x="826" y="1324" font-size="24" font-weight="normal" font-style="normal">logit(p3_raj) = eta3_raj</text>
<text x="826" y="1357" font-size="24" font-weight="normal" font-style="normal">0 absent / 1 explicit presence</text>
</g>
