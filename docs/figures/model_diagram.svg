<g id="CONFIG"><rect x="55" y="1460" width="1340" height="215" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="71" y="1488" font-size="20" font-weight="normal" font-style="normal">Separate fits with distinct beta and variance parameters. No estimated cross-outcome covariance.</text>
<text x="71" y="1517" font-size="20" font-weight="normal" font-style="normal">Within each model, item and actor random effects are independent and independent of X.</text>
<text x="71" y="1546" font-size="20" font-weight="normal" font-style="normal">Frequentist marginal ML, recursive mean/variance adaptive GH, 7 nodes per random intercept.</text>
<text x="71" y="1575" font-size="20" font-weight="normal" font-style="normal">Observed-information covariance and normal 95% Wald intervals. No priors, weights or imputation.</text>
<text x="71" y="1604" font-size="20" font-weight="normal" font-style="normal">No centering, interactions, indirect paths or random slopes. Country is not a random level.</text>
<text x="71" y="1633" font-size="20" font-weight="normal" font-style="normal">No missing required outcome, grouping or predictor values in the author-prepared analysis sample.</text>
<text x="71" y="1662" font-size="20" font-weight="normal" font-style="normal">Input: data/original/MedCon_Civility_actref.dta, with the source recodes shown above.</text>
</g>
<text x="40" y="1710" font-size="19" font-weight="normal" font-style="normal">Note. Original AI-assisted reconstruction from author code and inspected archive metadata. Student review pending.</text>
<text x="40" y="1736" font-size="19" font-weight="normal" font-style="normal">Historical Stata build and internal quadrature details remain incompletely pinned. See execution_specification.md.</text>
</g></svg>