<g id="X"><rect x="55" y="325" width="1340" height="165" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="71" y="353" font-size="21" font-weight="normal" font-style="normal">Five 0/1 indicators, in this order</text>
<text x="71" y="383" font-size="21" font-weight="normal" font-style="normal">X = [I(polsys=2), I(polsys=3), I(socdiv=2), I(mediatype=2), I(mediatype=3)]</text>
<text x="71" y="413" font-size="21" font-weight="normal" font-style="normal">Order: mixed, majoritarian, contested, website, newspaper</text>
<text x="71" y="443" font-size="21" font-weight="normal" font-style="normal">Codes above are analytical codes. Bases are consensus, stable secularism and blogs.</text>
</g>
<text x="195" y="548" font-size="28" font-weight="bold" font-style="normal">M2: outrage</text>
<text x="810" y="548" font-size="28" font-weight="bold" font-style="normal">M3: recognition</text>
<rect x="35" y="585" width="1380" height="175" fill="#f3f3f3" stroke="#aaa"/>
<text x="52" y="619" font-size="20" font-weight="bold" font-style="normal">Level 3</text>
<text x="52" y="647" font-size="20" font-weight="normal" font-style="normal">News item j</text>
<text x="52" y="675" font-size="20" font-weight="normal" font-style="normal">1183 items</text>
<rect x="35" y="780" width="1380" height="175" fill="#f3f3f3" stroke="#aaa"/>
<text x="52" y="814" font-size="20" font-weight="bold" font-style="normal">Level 2</text>
<text x="52" y="842" font-size="20" font-weight="normal" font-style="normal">Actor a</text>
<text x="52" y="870" font-size="20" font-weight="normal" font-style="normal">within item j</text>
<text x="52" y="898" font-size="20" font-weight="normal" font-style="normal">2453 groups</text>
<rect x="35" y="975" width="1380" height="440" fill="#f3f3f3" stroke="#aaa"/>
<text x="52" y="1009" font-size="20" font-weight="bold" font-style="normal">Level 1</text>
<text x="52" y="1037" font-size="20" font-weight="normal" font-style="normal">Directed</text>
<text x="52" y="1065" font-size="20" font-weight="normal" font-style="normal">reference r</text>
<text x="52" y="1093" font-size="20" font-weight="normal" font-style="normal">3770 rows</text>
<g id="M2U"><rect x="195" y="630" width="560" height="110" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="211" y="658" font-size="23" font-weight="normal" font-style="normal">u2_j ~ Normal(0, sigma2_item^2)</text>
<text x="211" y="690" font-size="23" font-weight="normal" font-style="normal">Item-specific random intercept</text>
<text x="211" y="722" font-size="23" font-weight="normal" font-style="normal">Group key: text_id</text>
</g>
<g id="M2V"><rect x="195" y="825" width="560" height="110" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="211" y="853" font-size="22" font-weight="normal" font-style="normal">v2_aj ~ Normal(0, sigma2_actor^2)</text>
<text x="211" y="884" font-size="22" font-weight="normal" font-style="normal">Originating actor/statement random intercept</text>
<text x="211" y="915" font-size="22" font-weight="normal" font-style="normal">act_id = text_id + &#x27;_&#x27; + akteur_id</text>
</g>
<g id="M2ETA"><rect x="195" y="1040" width="560" height="135" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="211" y="1068" font-size="24" font-weight="normal" font-style="normal">eta2_raj = beta2_0 + X_j beta2</text>
<text x="211" y="1101" font-size="24" font-weight="normal" font-style="normal">+ u2_j + v2_aj</text>
<text x="211" y="1134" font-size="24" font-weight="normal" font-style="normal">Five fixed slopes plus a fixed intercept</text>
</g>
<g id="M2Y"><rect x="195" y="1230" width="560" height="147" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="211" y="1258" font-size="24" font-weight="normal" font-style="normal">Outrage: actrefoutbin</text>
<text x="211" y="1291" font-size="24" font-weight="normal" font-style="normal">Y2_raj ~ Bernoulli(p2_raj)</text>
<text x="211" y="1324" font-size="24" font-weight="normal" font-style="normal">logit(p2_raj) = eta2_raj</text>
<text x="211" y="1357" font-size="24" font-weight="normal" font-style="normal">0 absent / 1 explicit presence</text>
</g>
