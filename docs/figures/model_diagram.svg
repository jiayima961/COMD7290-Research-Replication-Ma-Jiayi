<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1750" viewBox="0 0 1450 1750">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#222"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" fill="#111">
<text x="40" y="42" font-size="28" font-weight="bold" font-style="normal">Figure 1</text>
<text x="40" y="83" font-size="28" font-weight="normal" font-style="italic">Separate three-level models of directed-reference outrage and recognition</text>
<text x="40" y="112" font-size="20" font-weight="normal" font-style="normal">Observational window: August 2015-July 2016. No repeated-wave or lag structure.</text>
<g id="POL"><rect x="40" y="130" width="445" height="135" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="56" y="158" font-size="21" font-weight="normal" font-style="normal">Political system</text>
<text x="56" y="188" font-size="21" font-weight="normal" font-style="normal">raw 1 consensus / 2 majoritarian / 3 mixed</text>
<text x="56" y="218" font-size="21" font-weight="normal" font-style="normal">analysis 1 consensus / 2 mixed / 3</text>
<text x="56" y="248" font-size="21" font-weight="normal" font-style="normal">majoritarian</text>
</g>
<g id="SEC"><rect x="502" y="130" width="445" height="135" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="518" y="158" font-size="21" font-weight="normal" font-style="normal">Division over secularism</text>
<text x="518" y="188" font-size="21" font-weight="normal" font-style="normal">raw 1 contested / 2 stable</text>
<text x="518" y="218" font-size="21" font-weight="normal" font-style="normal">analysis 1 stable / 2 contested</text>
</g>
<g id="MED"><rect x="964" y="130" width="445" height="135" rx="7" fill="white" stroke="#222" stroke-width="1.7"/>
<text x="980" y="158" font-size="21" font-weight="normal" font-style="normal">Media category</text>
<text x="980" y="188" font-size="21" font-weight="normal" font-style="normal">raw 1 blog / 2 newspaper / 3 website</text>
<text x="980" y="218" font-size="21" font-weight="normal" font-style="normal">analysis 1 blog / 2 website / 3 newspaper</text>
</g>
